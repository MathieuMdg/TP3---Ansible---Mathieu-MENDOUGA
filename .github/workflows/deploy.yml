name: Deploy with Ansible

on:
  # sent by the TP2 repository once the new images are published on Docker Hub
  repository_dispatch:
    types: [deploy]
  # manual run from the Actions tab
  workflow_dispatch:

# never run two deployments at the same time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip install ansible

      - name: Prepare SSH key and inventory
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          cat > "$RUNNER_TEMP/inventory.yml" <<EOF
          all:
            vars:
              ansible_user: $SSH_USER
              ansible_ssh_private_key_file: $HOME/.ssh/deploy_key
            children:
              prod:
                hosts:
                  $SSH_HOST:
          EOF

      - name: Deploy with Ansible
        run: ansible-playbook -i "$RUNNER_TEMP/inventory.yml" playbook.yml
