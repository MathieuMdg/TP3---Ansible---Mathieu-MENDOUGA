---
- name: Launch proxy
  community.docker.docker_container:
    name: "{{ proxy_container }}"
    image: "{{ proxy_image }}"
    pull: true
    state: started
    restart_policy: unless-stopped
    ports:
      - "80:80"
    networks:
      - name: "{{ network_name }}"
  vars:
    ansible_python_interpreter: "{{ docker_python }}"